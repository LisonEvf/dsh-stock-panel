# CI：build + 全量 tsc + client.js 体积护栏（M11）
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (prepare 内自动 pnpm build → lib/)
        run: pnpm install --frozen-lockfile
      - name: Type check（全量，0 错误门禁）
        run: npx tsc --noEmit
      - name: Bundle size guard
        run: node scripts/check-bundle-size.mjs
